services:
  postgres:
    image: postgres:17
    container_name: pg-dvdrental
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dvdrental
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/dvdrental:/tmp/dvdrental:ro

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-dvdrental
    environment: 
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

volumes:
  pgdata:
